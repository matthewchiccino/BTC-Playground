# Regtest node config for My BTC Playground.
# Chain is mined once by setup_chain.py, then frozen. Nothing else mines.
regtest=1
server=1
listen=0
maxconnections=0
dbcache=50
txindex=1
fallbackfee=0.0001

# No rpcuser/rpcpassword here on purpose -- a committed credential reads
# as careless even on a loopback-only regtest node. Both start_node.sh
# (local dev) and entrypoint.sh (container) pass -rpcuser/-rpcpassword on
# the bitcoind command line instead, sourced from BTC_RPC_USER/
# BTC_RPC_PASSWORD -- the same env vars node.py already reads. Locally
# that resolves to the same default it always did; in the container,
# entrypoint.sh generates a random one at boot unless you supply your own.

[regtest]
rpcport=18443
