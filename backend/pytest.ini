[pytest]
# Run from backend/:  `pytest` (unit only) -- see ../Makefile for the other tiers.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -m "not integration and not network"
markers =
    unit: no node, no network -- pure logic, runs anywhere in seconds
    network: needs internet (fetches Bitcoin Core source from GitHub), no node
    integration: needs a live regtest bitcoind with a mined chain (setup_chain.py)
